<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VanzMusic - Nonstop Vibes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .header-gradient { background: linear-gradient(to bottom, #1db95422 0%, #000 100%); padding: 30px 20px 10px 20px; position: sticky; top: 0; z-index: 100; }
        .search-pill { background: #282828; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; margin-top: 15px; }
        input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 14px; font-weight: 600; }
        .song-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; transition: 0.2s; position: relative; }
        .song-item:active { background: rgba(255, 255, 255, 0.1); }
        .song-item img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; }
        .player-bar { position: fixed; bottom: 75px; left: 8px; right: 8px; background: #1db954; height: 62px; border-radius: 8px; display: none; align-items: center; padding: 0 12px; z-index: 1000; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        #fullPlayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; padding: 40px 30px; }
        .lyric-box { margin-top: 30px; height: 200px; overflow-y: auto; text-align: center; font-size: 18px; font-weight: 700; color: #b3b3b3; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; z-index: 1001; border-top: 1px solid #222; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #b3b3b3; gap: 4px; font-size: 9px; }
        .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="header-gradient">
        <h1 class="text-2xl font-extrabold tracking-tighter">Vanz<span class="text-[#1db954]">Music</span></h1>
        <div class="search-pill">
            <i class="fa-solid fa-search text-gray-400"></i>
            <input id="q" type="text" placeholder="Cari musik favoritmu..." onkeypress="if(event.key==='Enter') searchMusic()">
        </div>
    </div>

    <div class="px-5 mt-4">
        <h2 id="label" class="text-lg font-bold mb-4">Dibuat untuk Vanz</h2>
        <div id="list" class="pb-40"></div>
    </div>

    <div id="player" class="player-bar" onclick="openFullPlayer()">
        <img id="p-img" class="w-11 h-11 rounded" src="">
        <div class="flex-1 ml-3 overflow-hidden">
            <div id="p-title" class="text-[13px] font-bold text-black truncate">Memutar...</div>
        </div>
        <i onclick="event.stopPropagation(); toggle();" id="p-icon" class="fa-solid fa-pause text-black text-2xl px-2"></i>
    </div>

    <div id="fullPlayer">
        <i class="fa-solid fa-chevron-down text-2xl" onclick="closeFullPlayer()"></i>
        <img id="f-img" class="w-full aspect-square rounded-2xl mt-8 shadow-2xl object-cover" src="">
        <h2 id="f-title" class="text-xl font-black mt-6 truncate">Judul</h2>
        <div class="lyric-box" id="f-lyrics">Mengevaluasi vibes...</div>
        <div class="mt-auto pb-12">
            <div class="w-full bg-white/10 h-1.5 rounded-full mb-6"><div id="f-progress" class="bg-white h-full w-0"></div></div>
            <div class="flex justify-center items-center gap-8">
                <i class="fa-solid fa-backward-step text-3xl" onclick="prev()"></i>
                <i id="f-icon" class="fa-solid fa-circle-pause text-7xl" onclick="toggle()"></i>
                <i class="fa-solid fa-forward-step text-3xl" onclick="next()"></i>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div id="nav-home" class="nav-item active" onclick="goHome()"><i class="fa-solid fa-house text-xl"></i><span>Home</span></div>
        <div id="nav-liked" class="nav-item" onclick="showLiked()"><i class="fa-solid fa-heart text-xl"></i><span>Suka</span></div>
    </nav>

    <audio id="audio"></audio>

    <script>
        const audio = document.getElementById('audio');
        let playlist = [];
        let currentIdx = 0;
        let likedSongs = JSON.parse(localStorage.getItem('vanzLiked')) || [];

        async function searchMusic(query = "") {
            const q = query || document.getElementById('q').value || "Hindia Baskara";
            document.getElementById('list').innerHTML = '<p class="text-center py-10">Mencari getaran...</p>';
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            playlist = await res.json();
            renderList(playlist);
        }

        function renderList(data) {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';
            data.forEach((s, i) => {
                listDiv.innerHTML += `
                    <div class="song-item" onclick="putar(${i})">
                        <img src="${s.cover}">
                        <div class="flex-1 truncate"><div class="font-bold">${s.title}</div><div class="text-xs text-gray-400">${s.author}</div></div>
                    </div>`;
            });
        }

        async function putar(i) {
            currentIdx = i;
            const s = playlist[i];
            document.getElementById('player').style.display = 'flex';
            document.getElementById('p-img').src = document.getElementById('f-img').src = s.cover;
            document.getElementById('p-title').innerText = document.getElementById('f-title').innerText = s.title;
            document.getElementById('f-lyrics').innerText = `Lirik Otomatis:\n\n"${s.title}"\nOleh: ${s.author}\n\nSedang memutar vibe nonstop...`;
            audio.src = s.audio;
            audio.play();
        }

        // LOGIKA NONSTOP: Saat lagu habis, ambil lagu baru otomatis
        audio.onended = async () => {
            if (currentIdx < playlist.length - 1) {
                putar(currentIdx + 1);
            } else {
                // Auto-fetch lagu baru dari server saat list habis
                const res = await fetch('/api/random'); 
                const newSong = await res.json();
                playlist.push(newSong);
                putar(playlist.length - 1);
            }
        };

        function toggle() {
            if(audio.paused) { audio.play(); document.getElementById('p-icon').className = "fa-solid fa-pause text-black text-2xl px-2"; }
            else { audio.pause(); document.getElementById('p-icon').className = "fa-solid fa-play text-black text-2xl px-2"; }
        }

        audio.ontimeupdate = () => {
            document.getElementById('f-progress').style.width = (audio.currentTime / audio.duration) * 100 + '%';
        };

        function openFullPlayer() { document.getElementById('fullPlayer').style.display = 'flex'; }
        function closeFullPlayer() { document.getElementById('fullPlayer').style.display = 'none'; }
        function next() { if(currentIdx < playlist.length - 1) putar(currentIdx + 1); }
        function prev() { if(currentIdx > 0) putar(currentIdx - 1); }
        function goHome() { searchMusic(); }

        searchMusic();
    </script>
</body>
</html>
